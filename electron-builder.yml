appId: com.example.naskali # placeholder: use a reverse-DNS id you own before real distribution
productName: Naskali
directories:
  output: dist
  buildResources: build
icon: build/icon.png # 1024px source; mac/win formats are generated from it
files:
  - out/**
  - resources/** # window icon, referenced from out/main via electron-vite's ?asset import
  - package.json
linux:
  target: [AppImage, deb]
  category: Development
  icon: build/icons # per-size PNGs (16–32 px use the simplified build/icon-small.svg)
  maintainer: Naskali POC
  syncDesktopName: true # .desktop file name = desktopName, so the running window maps to its menu entry/icon
mac:
  target: dmg
win:
  target: nsis
