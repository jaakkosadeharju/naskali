<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#b6c2d2"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1440" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#gloss)"/>

  <!-- Database cylinder -->
  <g filter="url(#shadow)">
    <path d="M232 300 V700 A248 84 0 0 0 728 700 V300 Z" fill="url(#body)"/>
    <ellipse cx="480" cy="300" rx="248" ry="84" fill="url(#top)"/>
    <ellipse cx="480" cy="300" rx="248" ry="84" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.9"/>
  </g>
  <!-- Disk separators -->
  <path d="M232 434 A248 84 0 0 0 728 434" fill="none" stroke="#3b5bdb" stroke-opacity="0.55" stroke-width="22" stroke-linecap="butt"/>
  <path d="M232 568 A248 84 0 0 0 728 568" fill="none" stroke="#3b5bdb" stroke-opacity="0.55" stroke-width="22" stroke-linecap="butt"/>

  <!-- Prompt badge -->
  <g filter="url(#shadow)">
    <rect x="566" y="566" width="300" height="300" rx="76" fill="url(#badge)"/>
  </g>
  <rect x="566" y="566" width="300" height="300" rx="76" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <path d="M640 660 L708 716 L640 772" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M736 780 H800" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
</svg>
