<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>Naskali</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font-family: system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif;
      }
      .card {
        box-sizing: border-box;
        height: 100%;
        border-radius: 18px;
        background: radial-gradient(120% 100% at 50% 0%, #313e8a 0%, #2b3983 40%, #151a3d 100%);
        border: 1px solid rgba(171, 194, 233, 0.22);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #eef4ff;
      }
      img {
        width: 220px;
        height: 220px;
        filter: drop-shadow(0 14px 26px rgba(0, 10, 40, 0.55));
        animation: rise 0.6s ease-out both;
      }
      h1 {
        margin: 4px 0 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0.5px;
      }
      p {
        margin: -6px 0 0;
        font-size: 13px;
        color: #b9c9e9;
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-top: 6px;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #8fb9e5, #dbe9fb);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        img,
        .bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="splash.png" alt="" />
      <h1>Naskali</h1>
      <p>SQL client</p>
      <div class="bar"><span></span></div>
    </div>
  </body>
</html>
