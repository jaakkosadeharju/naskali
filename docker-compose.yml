services:
  mysql:
    image: mysql:8.4
    container_name: naskali-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - ./docker/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./docker/examples.mysql.sql:/docker-entrypoint-initdb.d/20-examples.sql:ro

  postgres:
    image: postgres:17
    container_name: naskali-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./docker/seed.postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./docker/examples.postgres.sql:/docker-entrypoint-initdb.d/20-examples.sql:ro

  # Opt-in (npm run db:up:mssql). Running it accepts Microsoft's SQL Server EULA
  # (Developer edition). Host port 14330, so it doesn't clash with a local SQL Server on 1433.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: naskali-mssql
    profiles: [mssql]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Naskali!Dev1"
    ports:
      - "14330:1433"
    entrypoint: ["/bin/bash", "/seed/mssql-entrypoint.sh"]
    volumes:
      - ./docker/mssql-entrypoint.sh:/seed/mssql-entrypoint.sh:ro
      - ./docker/seed.mssql.sql:/seed/seed.mssql.sql:ro
      - ./docker/examples.mssql.sql:/seed/examples.mssql.sql:ro
