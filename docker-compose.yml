services:
  mysql:
    image: mysql:8.4
    container_name: sqltool-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - ./docker/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
